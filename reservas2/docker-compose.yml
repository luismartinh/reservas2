version: '2'
services:
  php:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DB_DSN: mysql:host=host.docker.internal;port=33207;dbname=reservas2_1
      TEST_DB_DSN: mysql:host=host.docker.internal;port=33207;dbname=reservas2_test
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8001:80'
